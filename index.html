<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>話のネタ帳</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#233044;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e9f1;padding:18px max(16px,calc((100vw - 780px)/2))}h1{font-size:1.35rem;margin:0}header p{font-size:.85rem;color:#66758a;margin:5px 0 0}main{max-width:780px;margin:20px auto;padding:0 16px 60px}.panel,.card{background:#fff;border:1px solid #e4e9f0;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #15233b08}h2{font-size:1.05rem;margin:0 0 14px}label{display:block;font-size:.85rem;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;font:inherit;background:#fff;color:inherit}textarea{min-height:145px;resize:vertical}button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;background:#eaf0fc;color:#254c9c}button.primary{background:#335cd6;color:#fff}button.danger{background:#fff0ef;color:#ae3333}button:disabled{opacity:.55;cursor:wait}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row button{flex:0 0 auto}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tools label{margin:0}.note-head{width:100%;text-align:left;background:none;color:inherit;display:flex;align-items:center;justify-content:space-between;padding:0}.note-head strong{font-size:1.05rem}.badge{font-size:.76rem;color:#355fc4;background:#edf2ff;border-radius:99px;padding:4px 9px;margin-right:8px}.muted{color:#64748b;font-size:.8rem}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.chat{background:#f7f9fd;border-radius:12px;padding:14px;margin-top:14px}.reply{white-space:pre-wrap;line-height:1.65;background:white;border:1px solid #e3e9f3;padding:12px;border-radius:10px;margin:10px 0}.empty{text-align:center;color:#64748b;padding:32px}.status{min-height:1.4em;color:#4765a0;font-size:.85rem}@media(max-width:540px){.tools{grid-template-columns:1fr}.row>*{flex-basis:100%}.row button{flex:1}}
</style></head><body><header><h1>📒 話のネタ帳</h1><p>思いついた話を残して、AIと一緒に広げよう</p></header><main><section class="panel"><h2 id="formTitle">新しいネタを書く</h2><form id="form"><label for="title">見出し</label><input id="title" maxlength="100" required placeholder="例：旅行先で起きた偶然"><label for="category">カテゴリ</label><input id="category" list="categories" maxlength="40" placeholder="例：日常・仕事・創作"><datalist id="categories"></datalist><label for="memo">メモ</label><textarea id="memo" maxlength="20000" required placeholder="出来事、オチ、思いついたセリフなど"></textarea><div class="row" style="margin-top:12px"><button class="primary" type="submit">保存する</button><button type="button" id="cancel" hidden>編集をやめる</button></div></form><p class="muted">メモはデータベースに保存され、同じログイン情報で開いた端末間で共有されます。</p></section><section class="panel"><h2>ネタを探す</h2><div class="tools"><input id="search" type="search" placeholder="見出し・本文を検索" aria-label="ネタを検索"><select id="filter" aria-label="カテゴリで絞り込み"><option value="">すべてのカテゴリ</option></select></div></section><div id="list"></div></main><script type="text/plain" id="legacy-script">
'use strict';const KEY='hanashi-notes-v1';const $=id=>document.getElementById(id);let notes=[];let editing=null;let opened=null;try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))notes=saved.filter(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.memo==='string')}catch{alert('保存データを読み込めませんでした。新しいメモを保存する前に、この画面のデータを確認してください。')}function save(){try{localStorage.setItem(KEY,JSON.stringify(notes));return true}catch{alert('保存できませんでした。ブラウザの空き容量や設定を確認してください。');return false}}function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}function reset(){editing=null;$('form').reset();$('formTitle').textContent='新しいネタを書く';$('cancel').hidden=true}function render(){const cats=[...new Set(notes.map(n=>n.category||'未分類'))].sort((a,b)=>a.localeCompare(b,'ja'));const current=$('filter').value;$('filter').replaceChildren(new Option('すべてのカテゴリ',''),...cats.map(c=>new Option(c,c)));$('filter').value=cats.includes(current)?current:'';$('categories').replaceChildren(...cats.filter(c=>c!=='未分類').map(c=>{const o=document.createElement('option');o.value=c;return o}));const query=$('search').value.trim().toLocaleLowerCase();const visible=notes.filter(n=>(!$('filter').value||(n.category||'未分類')===$('filter').value)&&(!query||(n.title+' '+n.memo).toLocaleLowerCase().includes(query))).sort((a,b)=>b.updated-a.updated);$('list').replaceChildren();if(!visible.length){$('list').append(el('div','panel empty',notes.length?'該当するネタがありません':'まだネタがありません。上のフォームから追加しましょう。'));return}for(const n of visible){const card=el('article','card');const head=el('button','note-head');head.type='button';head.setAttribute('aria-expanded',String(opened===n.id));const label=el('span');label.append(el('span','badge',n.category||'未分類'),el('strong','',n.title));head.append(label,el('span','',opened===n.id?'−':'＋'));head.onclick=()=>{opened=opened===n.id?null:n.id;render()};card.append(head);if(opened===n.id){card.append(el('p','muted',new Date(n.updated).toLocaleString('ja-JP')),el('div','body',n.memo));const actions=el('div','row');actions.style.marginTop='14px';const edit=el('button','','編集');edit.onclick=()=>{editing=n.id;$('title').value=n.title;$('category').value=n.category||'';$('memo').value=n.memo;$('formTitle').textContent='ネタを編集';$('cancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'});$('title').focus()};const del=el('button','danger','削除');del.onclick=()=>{if(confirm('このネタを削除しますか？')){const old=notes;notes=notes.filter(x=>x.id!==n.id);if(!save())notes=old;else{if(editing===n.id)reset();opened=null;render()}}};actions.append(edit,del);card.append(actions);const chat=el('div','chat');chat.append(el('h2','','AIに相談'));const select=el('select');[['面白くする','この話を人に話すときに面白くなる構成、具体的な言い回し、オチを提案してください。'],['アイデアを広げる','このメモから派生する新しいアイデアを3つ提案してください。'],['自由に質問','']].forEach(([name,prompt])=>select.add(new Option(name,prompt)));const question=el('textarea');question.placeholder='AIへの追加の質問（自由に入力）';question.style.minHeight='75px';const ask=el('button','primary','AIに相談する');const status=el('p','status','');const reply=el('div','reply');reply.hidden=true;ask.onclick=async()=>{const prompt=(select.value+' '+question.value).trim();if(!prompt){status.textContent='質問を入力してください。';return}ask.disabled=true;status.textContent='考えています…';reply.hidden=true;try{const res=await fetch('/api/advice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:n.title,memo:n.memo,category:n.category||'未分類',question:prompt})});const data=await res.json();if(!res.ok)throw Error(data.error||'通信エラー');reply.textContent=data.answer;reply.hidden=false;status.textContent=''}catch(e){status.textContent=e.message}finally{ask.disabled=false}};chat.append(select,question,ask,status,reply);card.append(chat)}$('list').append(card)}}$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim(),memo=$('memo').value.trim(),category=$('category').value.trim();if(!title||!memo)return;const old=notes.slice();if(editing){const n=notes.find(x=>x.id===editing);if(!n)return;n.title=title;n.memo=memo;n.category=category;n.updated=Date.now();opened=n.id}else{const id=crypto.randomUUID();notes.push({id,title,memo,category,updated:Date.now()});opened=id}if(save()){reset();render()}else notes=old};$('cancel').onclick=reset;$('search').oninput=render;$('filter').onchange=render;render();
</script><script src="/app.js"></script></body></html>
